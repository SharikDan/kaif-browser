<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>KaifBrowser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #0f0f0f 0%, #1a0a0a 50%, #0f0f0f 100%); color: white; font-family: 'Segoe UI', Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .titlebar { background: rgba(0,0,0,0.95); border-bottom: 2px solid #ff0040; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; -webkit-app-region: drag; }
        .logo { color: #ff0040; font-weight: bold; font-size: 18px; text-shadow: 0 0 10px rgba(255,0,64,0.7); }
        .window-controls button { -webkit-app-region: no-drag; width: 32px; height: 32px; border: none; border-radius: 6px; background: transparent; color: rgba(255,255,255,0.8); cursor: pointer; font-size: 16px; margin-left: 8px; transition: all 0.2s; }
        .window-controls button:hover { background: rgba(255,0,64,0.3); color: white; }
        .window-controls button.close:hover { background: #ff0040; }
        .tabbar { background: rgba(0,0,0,0.8); padding: 10px 15px 0; display: flex; align-items: flex-end; gap: 5px; border-bottom: 1px solid rgba(255,0,64,0.3); }
        .tab { background: rgba(255,0,64,0.15); border: 1px solid rgba(255,0,64,0.4); border-bottom: none; border-radius: 10px 10px 0 0; padding: 10px 20px; cursor: pointer; display: flex; align-items: center; gap: 10px; max-width: 220px; transition: all 0.3s; }
        .tab:hover { background: rgba(255,0,64,0.25); }
        .tab.active { background: rgba(255,0,64,0.4); border-color: #ff0040; box-shadow: 0 -2px 10px rgba(255,0,64,0.4); }
        .tab-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
        .tab-close { width: 20px; height: 20px; border: none; border-radius: 50%; background: transparent; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .tab-close:hover { background: rgba(255,0,64,0.6); color: white; }
        .new-tab { width: 35px; height: 35px; border: none; border-radius: 10px 10px 0 0; background: rgba(255,0,64,0.2); color: white; cursor: pointer; font-size: 20px; transition: all 0.2s; }
        .new-tab:hover { background: rgba(255,0,64,0.4); transform: translateY(-2px); }
        .navbar { background: rgba(0,0,0,0.85); padding: 12px 15px; display: flex; gap: 10px; align-items: center; }
        .nav-btn { width: 38px; height: 38px; border: none; border-radius: 10px; background: rgba(255,0,64,0.25); color: #ff0040; cursor: pointer; font-size: 18px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .nav-btn:hover { background: #ff0040; color: white; transform: scale(1.1); box-shadow: 0 0 15px rgba(255,0,64,0.5); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        .url-bar { flex: 1; height: 38px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,0,64,0.4); border-radius: 10px; padding: 0 15px; color: white; font-size: 14px; outline: none; transition: all 0.2s; }
        .url-bar:focus { border-color: #ff0040; background: rgba(255,255,255,0.15); box-shadow: 0 0 15px rgba(255,0,64,0.3); }
        .search-select { position: relative; }
        .search-btn { width: 38px; height: 38px; border: none; border-radius: 10px; background: rgba(255,0,64,0.25); color: #ff0040; cursor: pointer; font-size: 18px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .search-btn:hover { background: #ff0040; color: white; }
        .search-menu { position: absolute; top: 100%; right: 0; margin-top: 10px; background: rgba(0,0,0,0.95); border: 2px solid #ff0040; border-radius: 10px; padding: 8px; display: none; z-index: 1000; min-width: 200px; box-shadow: 0 5px 20px rgba(255,0,64,0.4); }
        .search-menu.show { display: block; }
        .search-option { padding: 12px; cursor: pointer; border-radius: 8px; transition: all 0.2s; display: flex; align-items: center; gap: 12px; }
        .search-option:hover { background: rgba(255,0,64,0.3); }
        .search-option.active { background: rgba(255,0,64,0.4); }
        .search-logo { width: 24px; height: 24px; }
        .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f0f0f 0%, #1a0a0a 50%, #0f0f0f 100%); }
        .welcome-content { text-align: center; width: 100%; max-width: 700px; padding: 40px; }
        .clock-container { margin-bottom: 50px; text-align: center; }
        .time { font-size: 120px; font-weight: 300; color: #ff0040; text-shadow: 0 0 50px rgba(255,0,64,0.8); letter-spacing: 4px; line-height: 1; animation: glow 3s ease-in-out infinite; }
        .date { font-size: 22px; color: rgba(255,255,255,0.7); margin-top: 15px; letter-spacing: 1px; }
        @keyframes glow { 0%, 100% { text-shadow: 0 0 50px rgba(255,0,64,0.8); } 50% { text-shadow: 0 0 80px rgba(255,0,64,1), 0 0 100px rgba(255,0,64,0.6); } }
        .search-box { display: flex; gap: 12px; max-width: 650px; margin: 0 auto; }
        .search-input { flex: 1; height: 55px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,0,64,0.4); border-radius: 12px; padding: 0 25px; color: white; font-size: 16px; outline: none; transition: all 0.2s; }
        .search-input:focus { border-color: #ff0040; background: rgba(255,255,255,0.15); box-shadow: 0 0 20px rgba(255,0,64,0.4); }
        .search-btn-main { height: 55px; padding: 0 35px; background: linear-gradient(135deg, #ff0040, #ff0066); border: none; border-radius: 12px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .search-btn-main:hover { transform: scale(1.05); box-shadow: 0 5px 25px rgba(255,0,64,0.6); }
        .loading-indicator { position: fixed; top: 76px; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #ff0040, transparent); display: none; z-index: 10000; }
        .loading-indicator.active { display: block; animation: loading 1.5s ease-in-out infinite; }
        @keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .webview-container { flex: 1; display: none; background: white; }
        webview { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div class="loading-indicator" id="loadingIndicator"></div>
    
    <div class="titlebar">
        <div class="logo">
            <svg style="width:20px;height:20px;vertical-align:middle;margin-right:8px" viewBox="0 0 24 24" fill="#ff0040">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            KaifBrowser
        </div>
        <div class="window-controls">
            <button onclick="window.electronAPI.minimize()" title="Свернуть">
                <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13H5v-2h14v2z"/></svg>
            </button>
            <button onclick="window.electronAPI.maximize()" title="Развернуть">
                <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="currentColor"><path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H6V6h12v12z"/></svg>
            </button>
            <button class="close" onclick="window.electronAPI.close()" title="Закрыть">
                <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>
    </div>
    
    <div class="tabbar" id="tabbar">
        <button class="new-tab" onclick="newTab()" title="Новая вкладка">
            <svg style="width:18px;height:18px" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
    </div>
    
    <div class="navbar">
        <button class="nav-btn" id="backBtn" onclick="goBack()" disabled title="Назад">
            <svg style="width:20px;height:20px" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <button class="nav-btn" id="forwardBtn" onclick="goForward()" disabled title="Вперед">
            <svg style="width:20px;height:20px" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </button>
        <button class="nav-btn" onclick="refresh()" title="Обновить">
            <svg style="width:20px;height:20px" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <button class="nav-btn" onclick="goHome()" title="Домой">
            <svg style="width:20px;height:20px" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </button>
        <input type="text" class="url-bar" id="urlBar" placeholder="Введите URL или поиск..." onkeypress="if(event.key==='Enter')navigate()">
        <button class="nav-btn" onclick="navigate()" title="Перейти">
            <svg style="width:20px;height:20px" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </button>
        
        <div class="search-select">
            <button class="search-btn" onclick="toggleSearchMenu()" title="Поисковая система">
                <svg style="width:20px;height:20px" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <div class="search-menu" id="searchMenu">
                <div class="search-option active" data-engine="google" onclick="selectEngine('google')">
                    <svg class="search-logo" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    <span>Google</span>
                </div>
                <div class="search-option" data-engine="yandex" onclick="selectEngine('yandex')">
                    <svg class="search-logo" viewBox="0 0 48 48"><path fill="#FC3F1D" d="M24 0C10.745 0 0 10.745 0 24s10.745 24 24 24 24-10.745 24-24S37.255 0 24 0zm3.123 34.5c-.834 2.001-1.834 3.501-3.001 4.501-1.167 1-2.5 1.5-4.001 1.5-1.834 0-3.334-.667-4.501-2-1.167-1.334-1.75-3.167-1.75-5.501 0-2.167.5-4.167 1.5-6 .834-1.5 2-2.834 3.5-4l3.5-2.667c.5-.334.834-.667 1.167-1 .334-.334.667-.834.834-1.334.167-.5.334-1 .334-1.667 0-.834-.167-1.5-.5-2-.334-.5-.834-.834-1.5-1-.334-.167-.834-.167-1.334-.167-1 0-1.834.334-2.5 1-.667.667-1 1.5-1 2.5h-3.5c0-1.834.667-3.334 2-4.5 1.334-1.167 3-1.75 5-1.75 2.334 0 4.167.667 5.5 2 1.334 1.334 2 3.167 2 5.5 0 1.167-.167 2.167-.5 3-.334.834-.834 1.667-1.5 2.334-.667.667-1.5 1.334-2.5 2l-2.5 1.834c-.834.667-1.5 1.334-2 2-.5.667-.834 1.334-1 2-.167.667-.334 1.334-.334 2.167 0 1.167.167 2 .5 2.667.334.667.834 1 1.5 1 .5 0 .834-.167 1.167-.5.334-.334.667-.834 1-1.5l3.167 1.5z"/></svg>
                    <span>Yandex</span>
                </div>
                <div class="search-option" data-engine="duckduckgo" onclick="selectEngine('duckduckgo')">
                    <svg class="search-logo" viewBox="0 0 48 48"><path fill="#DE5833" d="M24 0C10.745 0 0 10.745 0 24s10.745 24 24 24 24-10.745 24-24S37.255 0 24 0zm-6 16c0-2.209 1.791-4 4-4s4 1.791 4 4-1.791 4-4 4-4-1.791-4-4zm12 16c-2.209 0-4-1.791-4-4s1.791-4 4-4 4 1.791 4 4-1.791 4-4 4z"/><path fill="#81868D" d="M24 8c-8.837 0-16 7.163-16 16s7.163 16 16 16 16-7.163 16-16S32.837 8 24 8zm0 28c-6.627 0-12-5.373-12-12s5.373-12 12-12 12 5.373 12 12-5.373 12-12 12z"/></svg>
                    <span>DuckDuckGo</span>
                </div>
                <div class="search-option" data-engine="bing" onclick="selectEngine('bing')">
                    <svg class="search-logo" viewBox="0 0 48 48"><path fill="#008373" d="M6 4l16 8v24l-16-8V4zm16 8l16-8v24l-16 8V12z"/><path fill="#00A4EF" d="M22 12l16-8v24l-16 8V12z"/></svg>
                    <span>Bing</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="welcome" id="welcome">
        <div class="welcome-content">
            <div class="clock-container">
                <div class="time" id="clockTime">00:00:00</div>
                <div class="date" id="clockDate">Загрузка...</div>
            </div>
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск..." onkeypress="if(event.key==='Enter')search(true)">
                <button class="search-btn-main" onclick="search(true)">Поиск</button>
            </div>
        </div>
    </div>
    
    <div class="webview-container" id="webviewContainer">
        <webview id="webview" partition="persist:kaifbrowser"></webview>
    </div>
    
    <script>
        const engines = {
            google: { name: 'Google', url: 'https://www.google.com/search?q=' },
            yandex: { name: 'Yandex', url: 'https://yandex.ru/search/?text=' },
            duckduckgo: { name: 'DuckDuckGo', url: 'https://duckduckgo.com/?q=' },
            bing: { name: 'Bing', url: 'https://www.bing.com/search?q=' }
        };
        
        let currentEngine = 'google';
        let tabs = [];
        let activeTab = null;
        let tabId = 0;
        
        const webview = document.getElementById('webview');
        const welcome = document.getElementById('welcome');
        const webviewContainer = document.getElementById('webviewContainer');
        const urlBar = document.getElementById('urlBar');
        const tabbar = document.getElementById('tabbar');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const backBtn = document.getElementById('backBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const searchInput = document.getElementById('searchInput');
        
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clockTime').textContent = hours + ':' + minutes + ':' + seconds;
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('ru-RU', options);
            document.getElementById('clockDate').textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        }
        updateClock();
        setInterval(updateClock, 1000);
        
        function saveTabs() {
            const tabsData = tabs.map(tab => ({ id: tab.id, url: tab.url, title: tab.title }));
            localStorage.setItem('kaifbrowser_tabs', JSON.stringify(tabsData));
            localStorage.setItem('kaifbrowser_activeTab', activeTab);
        }
        
        function loadTabs() {
            const savedTabs = localStorage.getItem('kaifbrowser_tabs');
            const savedActiveTab = localStorage.getItem('kaifbrowser_activeTab');
            if (savedTabs) {
                const parsed = JSON.parse(savedTabs);
                parsed.forEach(tabData => {
                    tabId++;
                    tabs.push({ id: 'tab-' + tabId, url: tabData.url || '', title: tabData.title || 'Новая вкладка' });
                });
                renderTabs();
                if (savedActiveTab && tabs.find(t => t.id === savedActiveTab)) {
                    switchTab(savedActiveTab);
                } else if (tabs.length > 0) {
                    switchTab(tabs[0].id);
                } else {
                    newTab();
                }
            } else {
                newTab();
            }
        }
        
        function newTab(url = '', title = 'Новая вкладка') {
            tabId++;
            const id = 'tab-' + tabId;
            tabs.push({ id, url, title });
            renderTabs();
            switchTab(id);
            if (url) {
                navigateTo(url, false);
            }
            saveTabs();
            return id;
        }
        
        function closeTab(id, e) {
            if (e) e.stopPropagation();
            const idx = tabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            tabs.splice(idx, 1);
            if (tabs.length === 0) {
                newTab();
            } else if (activeTab === id) {
                const newIdx = Math.min(idx, tabs.length - 1);
                switchTab(tabs[newIdx].id);
            }
            renderTabs();
            saveTabs();
        }
        
        function switchTab(id) {
            activeTab = id;
            const tab = tabs.find(t => t.id === id);
            if (!tab) return;
            urlBar.value = tab.url || '';
            if (tab.url) {
                welcome.style.display = 'none';
                webviewContainer.style.display = 'block';
                setTimeout(() => {
                    try {
                        webview.src = tab.url;
                    } catch (e) {
                        console.warn('Ошибка загрузки webview:', e);
                    }
                }, 50);
            } else {
                welcome.style.display = 'flex';
                webviewContainer.style.display = 'none';
                webview.src = '';
                searchInput.value = '';
            }
            renderTabs();
            saveTabs();
            setTimeout(updateNavButtons, 100);
        }
        
        function renderTabs() {
            tabbar.querySelectorAll('.tab').forEach(el => el.remove());
            tabs.forEach(tab => {
                const div = document.createElement('div');
                div.className = 'tab' + (tab.id === activeTab ? ' active' : '');
                div.onclick = () => switchTab(tab.id);
                div.innerHTML = '<span class="tab-title">' + (tab.title || 'Новая вкладка') + '</span><button class="tab-close" onclick="closeTab(\'' + tab.id + '\',event)">✕</button>';
                tabbar.insertBefore(div, tabbar.lastElementChild);
            });
        }
        
        function navigateTo(url, openInNewTab = false) {
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            if (openInNewTab) {
                newTab(url, 'Загрузка...');
            } else {
                const tab = tabs.find(t => t.id === activeTab);
                if (tab) {
                    tab.url = url;
                    tab.title = url;
                }
                welcome.style.display = 'none';
                webviewContainer.style.display = 'block';
                setTimeout(() => {
                    try {
                        webview.src = url;
                    } catch (e) {
                        console.warn('Ошибка навигации:', e);
                    }
                }, 50);
                urlBar.value = url;
                renderTabs();
                saveTabs();
                setTimeout(updateNavButtons, 100);
            }
        }
        
        function navigate() {
            const url = urlBar.value.trim();
            if (!url) return;
            if ((url.includes('.') && !url.includes(' ')) || url.startsWith('http')) {
                navigateTo(url, false);
            } else {
                const searchUrl = engines[currentEngine].url + encodeURIComponent(url);
                navigateTo(searchUrl, true);
            }
        }
        
        function goHome() {
            const tab = tabs.find(t => t.id === activeTab);
            if (tab) {
                tab.url = '';
                tab.title = 'Новая вкладка';
            }
            welcome.style.display = 'flex';
            webviewContainer.style.display = 'none';
            webview.src = '';
            urlBar.value = '';
            searchInput.value = '';
            renderTabs();
            saveTabs();
            updateNavButtons();
        }
        
        function goBack() {
            try {
                if (webview.canGoBack()) {
                    webview.goBack();
                    setTimeout(updateNavButtons, 300);
                }
            } catch (e) {
                console.warn('Ошибка назад:', e);
            }
        }
        function goForward() {
            try {
                if (webview.canGoForward()) {
                    webview.goForward();
                    setTimeout(updateNavButtons, 300);
                }
            } catch (e) {
                console.warn('Ошибка вперёд:', e);
            }
        }
        function refresh() {
            try {
                loadingIndicator.classList.add('active');
                webview.reload();
            } catch (e) {
                console.warn('Ошибка обновления:', e);
                loadingIndicator.classList.remove('active');
            }
        }
        
        function updateNavButtons() {
            try {
                backBtn.disabled = !webview.canGoBack();
                forwardBtn.disabled = !webview.canGoForward();
            } catch (e) {
                backBtn.disabled = true;
                forwardBtn.disabled = true;
            }
        }
        
        function search(openInNewTab = false) {
            let query = searchInput.value.trim();
            if (!query) return;
            const searchUrl = engines[currentEngine].url + encodeURIComponent(query);
            navigateTo(searchUrl, openInNewTab);
        }
        
        function toggleSearchMenu() {
            document.getElementById('searchMenu').classList.toggle('show');
        }
        
        function selectEngine(engine) {
            currentEngine = engine;
            document.querySelectorAll('.search-option').forEach(el => el.classList.remove('active'));
            document.querySelector('[data-engine="' + engine + '"]').classList.add('active');
            document.getElementById('searchMenu').classList.remove('show');
            searchInput.placeholder = 'Поиск в ' + engines[engine].name + '...';
        }
        
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-select')) {
                document.getElementById('searchMenu').classList.remove('show');
            }
        });
        
        webview.addEventListener('did-start-loading', () => {
            loadingIndicator.classList.add('active');
        });
        webview.addEventListener('did-stop-loading', () => {
            loadingIndicator.classList.remove('active');
            updateNavButtons();
        });
        webview.addEventListener('did-navigate', (e) => {
            const url = e.url;
            urlBar.value = url;
            const tab = tabs.find(t => t.id === activeTab);
            if (tab) {
                tab.url = url;
                tab.title = url;
                renderTabs();
                saveTabs();
            }
            updateNavButtons();
        });
        webview.addEventListener('page-title-updated', (e) => {
            const tab = tabs.find(t => t.id === activeTab);
            if (tab && e.title) {
                tab.title = e.title;
                renderTabs();
                saveTabs();
            }
        });
        webview.addEventListener('new-window', (e) => {
            e.preventDefault();
            if (e.url) {
                navigateTo(e.url, true);
            }
        });
        webview.addEventListener('dom-ready', () => {
            updateNavButtons();
        });
        webview.addEventListener('did-fail-load', (e) => {
            loadingIndicator.classList.remove('active');
            console.warn('Ошибка загрузки страницы:', e);
        });
        
        window.addEventListener('beforeunload', () => {
            saveTabs();
        });
        
        selectEngine('google');
        loadTabs();
    </script>
</body>
</html>

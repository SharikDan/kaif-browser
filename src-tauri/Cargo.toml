[package]
name = "kaif-browser"
version = "6.0.0"
description = "KaifBrowser - real WebView browser on Tauri 2"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = "1.0"
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 's'
lto = true
codegen-units = 1
panic = 'abort'
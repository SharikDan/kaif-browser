<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>KaifBrowser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            transition: background-image 0.5s ease;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: -1;
        }
        .titlebar { background: rgba(0,0,0,0.9); border-bottom: 2px solid #ff0040; padding: 8px 15px; display: flex; align-items: center; justify-content: space-between; -webkit-app-region: drag; }
        .logo { color: #ff0040; font-weight: bold; font-size: 18px; }
        .window-controls button { -webkit-app-region: no-drag; width: 32px; height: 32px; border: none; border-radius: 6px; background: transparent; color: rgba(255,255,255,0.8); cursor: pointer; }
        .window-controls button:hover { background: rgba(255,0,64,0.3); color: white; }
        .window-controls button.close:hover { background: #ff0040; }

        .tabbar { background: rgba(0,0,0,0.85); padding: 6px 10px 0 10px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid rgba(255,0,64,0.3); flex-shrink: 0; }
        .tabs-scroll-container { flex: 1; overflow-x: auto; overflow-y: hidden; display: flex; gap: 4px; padding-bottom: 4px; scroll-behavior: smooth; }
        .tabs-scroll-container::-webkit-scrollbar { height: 0; }
        .tab { flex-shrink: 0; background: rgba(255,0,64,0.15); border: 1px solid rgba(255,0,64,0.4); border-bottom: none; border-radius: 8px 8px 0 0; padding: 6px 14px; cursor: pointer; display: flex; align-items: center; gap:8px; }
        .tab:hover { background: rgba(255,0,64,0.25); }
        .tab.active { background: rgba(255,0,64,0.4); border-color: #ff0040; box-shadow: 0 -2px 8px rgba(255,0,64,0.4); }
        .tab-title { flex: 1; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
        .tab-close { width: 18px; height: 18px; border: none; border-radius: 50%; background: transparent; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 13px; flex-shrink: 0; }
        .tab-close:hover { background: rgba(255,0,64,0.6); color: white; }
        .tab-nav-btn { width: 26px; height: 26px; border: none; border-radius: 50%; background: rgba(255,0,64,0.3); color: white; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .tab-nav-btn:hover { background: #ff0040; transform: scale(1.1); }
        .tab-nav-btn:disabled { opacity: 0.3; cursor: default; transform: none; }
        .new-tab { width: 32px; height: 32px; border: none; border-radius: 8px 8px 0 0; background: rgba(255,0,64,0.2); color: white; cursor: pointer; font-size: 18px; flex-shrink: 0; -webkit-app-region: no-drag; }
        .new-tab:hover { background: rgba(255,0,64,0.4); transform: translateY(-2px); }

        .navbar { background: rgba(0,0,0,0.85); padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
        .nav-btn { width: 34px; height: 34px; border: none; border-radius: 8px; background: rgba(255,0,64,0.25); color: #ff0040; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .nav-btn:hover { background: #ff0040; color: white; transform: scale(1.05); }
        .nav-btn:disabled { opacity: 0.3; cursor: default; transform: none; }
        .url-bar { flex: 1; min-width: 150px; height: 34px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,0,64,0.4); border-radius: 8px; padding: 0 12px; color: white; font-size: 14px; }
        .url-bar:focus { border-color: #ff0040; background: rgba(255,255,255,0.15); }
        .toolbar-buttons { display: flex; gap: 4px; align-items: center; }
        .toolbar-btn { background: none; border: none; color: rgba(255,255,255,0.6); cursor: pointer; padding: 4px 8px; border-radius: 6px; font-size: 14px; transition: all 0.2s; }
        .toolbar-btn:hover { background: rgba(255,0,64,0.3); color: white; }

        .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
        .welcome-content { text-align: center; width: 100%; max-width: 700px; }
        .clock-container { margin-bottom: 30px; }
        .time { font-size: 90px; font-weight: 300; color: #ff0040; text-shadow: 0 0 40px rgba(255,0,64,0.6); letter-spacing: 2px; line-height: 1; }
        .date { font-size: 20px; color: rgba(255,255,255,0.7); margin-top: 10px; }
        .search-box { display: flex; gap: 10px; max-width: 650px; margin: 0 auto; }
        .search-input { flex: 1; height: 48px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,0,64,0.4); border-radius: 12px; padding: 0 20px; color: white; font-size: 16px; outline: none; }
        .search-input:focus { border-color: #ff0040; background: rgba(255,255,255,0.15); }
        .search-btn-main { height: 48px; padding: 0 30px; background: linear-gradient(135deg, #ff0040, #ff0066); border: none; border-radius: 12px; color: white; font-size: 16px; font-weight: bold; }
        .search-btn-main:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(255,0,64,0.5); }

        .search-history { margin-top: 15px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .history-item { background: rgba(255,255,255,0.08); padding: 6px 14px; border-radius: 20px; font-size: 13px; color: rgba(255,255,255,0.7); cursor: pointer; transition: all 0.2s; }
        .history-item:hover { background: rgba(255,0,64,0.3); color: white; }

        .wallpaper-panel { display: none; background: rgba(0,0,0,0.9); padding: 12px; border-top: 1px solid #ff0040; flex-wrap: wrap; gap: 8px; justify-content: center; max-height: 120px; overflow: auto; }
        .wallpaper-panel.show { display: flex; }
        .wallpaper-thumb { width: 60px; height: 40px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; background-size: cover; background-position: center; }
        .wallpaper-thumb:hover { border-color: #ff0040; transform: scale(1.05); }
        .wallpaper-thumb.active { border-color: #ff0040; box-shadow: 0 0 10px #ff0040; }

        .downloads-panel { display: none; position: fixed; bottom: 60px; right: 20px; background: rgba(0,0,0,0.95); border: 1px solid #ff0040; border-radius: 12px; padding: 12px; min-width: 280px; }
        .downloads-panel.show { display: block; }
        .download-item { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .download-item .filename { color: rgba(255,255,255,0.8); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .download-item .status { color: #ff0040; font-size: 12px; margin-left: 10px; }
        .download-item .open-folder { background: none; border: none; color: rgba(255,255,255,0.5); cursor: pointer; font-size: 14px; margin-left: 8px; }
        .download-item .open-folder:hover { color: #ff0040; }

        .webview-container { flex: 1; display: none; background: white; }
        webview { width: 100%; height: 100%; border: none; }

        .loading-indicator { position: fixed; top: 76px; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #ff0040, transparent); display: none; z-index: 10000; }
        .loading-indicator.active { display: block; animation: loading 1.5s ease-in-out infinite; }
        @keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    </style>
</head>
<body>
    <div class="loading-indicator" id="loadingIndicator"></div>

    <div class="titlebar">
        <div class="logo">⚡ KaifBrowser</div>
        <div class="window-controls">
            <button onclick="window.electronAPI.minimize()">─</button>
            <button onclick="window.electronAPI.maximize()">☐</button>
            <button class="close" onclick="window.electronAPI.close()">✕</button>
        </div>
    </div>

    <div class="tabbar" id="tabbar">
        <button class="tab-nav-btn" id="scrollLeftBtn" onclick="scrollTabs(-1)">◀</button>
        <div class="tabs-scroll-container" id="tabsContainer"></div>
        <button class="tab-nav-btn" id="scrollRightBtn" onclick="scrollTabs(1)">▶</button>
        <button class="new-tab" onclick="newTab()">+</button>
    </div>

    <div class="navbar">
        <button class="nav-btn" id="backBtn" onclick="goBack()" disabled>◀</button>
        <button class="nav-btn" id="forwardBtn" onclick="goForward()" disabled>▶</button>
        <button class="nav-btn" onclick="refresh()">⟳</button>
        <button class="nav-btn" onclick="goHome()">🏠</button>
        <input type="text" class="url-bar" id="urlBar" placeholder="Введите URL или поиск..." onkeypress="if(event.key==='Enter')navigate()">
        <button class="nav-btn" onclick="navigate()">➜</button>
        <div class="toolbar-buttons">
            <button class="toolbar-btn" onclick="toggleWallpaperPanel()" title="Обои">🖼️</button>
            <button class="toolbar-btn" onclick="toggleDownloadsPanel()" title="Загрузки">📥</button>
        </div>
    </div>

    <div class="wallpaper-panel" id="wallpaperPanel"></div>

    <div class="welcome" id="welcome">
        <div class="welcome-content">
            <div class="clock-container">
                <div class="time" id="clockTime">00:00:00</div>
                <div class="date" id="clockDate">Загрузка...</div>
            </div>
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск в Google..." onkeypress="if(event.key==='Enter')search(true)">
                <button class="search-btn-main" onclick="search(true)">Поиск</button>
            </div>
            <div class="search-history" id="searchHistory"></div>
        </div>
    </div>

    <div class="webview-container" id="webviewContainer">
        <webview id="webview" partition="persist:kaifbrowser" webpreferences="contextIsolation=no,nodeIntegration=yes"></webview>
    </div>

    <div class="downloads-panel" id="downloadsPanel">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
            <span style="color:#ff0040; font-weight:bold;">Загрузки</span>
            <button onclick="document.getElementById('downloadsPanel').classList.remove('show')" style="background:none;border:none;color:white;cursor:pointer;">✕</button>
        </div>
        <div id="downloadsList"></div>
    </div>

    <script>
        const electronAPI = window.electronAPI;
        const SEARCH_URL = 'https://www.google.com/search?q=';
        const WALLPAPER_COUNT = 17;
        let currentWallpaper = 1;

        const webview = document.getElementById('webview');
        const welcome = document.getElementById('welcome');
        const webviewContainer = document.getElementById('webviewContainer');
        const urlBar = document.getElementById('urlBar');
        const tabsContainer = document.getElementById('tabsContainer');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const backBtn = document.getElementById('backBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const searchInput = document.getElementById('searchInput');
        const searchHistory = document.getElementById('searchHistory');
        const wallpaperPanel = document.getElementById('wallpaperPanel');
        const downloadsPanel = document.getElementById('downloadsPanel');
        const downloadsList = document.getElementById('downloadsList');

        let tabs = [], activeTab = null, tabId = 0;
        let searchHistoryItems = JSON.parse(localStorage.getItem('kaifbrowser_searchHistory') || '[]');
        let downloads = JSON.parse(localStorage.getItem('kaifbrowser_downloads') || '[]');

        // Debounce / batching localStorage writes to avoid synchronous stalls
        const _persistQueue = new Map();
        let _persistTimer = null;
        function scheduleLocalStorageWrite(key, value) {
            _persistQueue.set(key, value);
            if (_persistTimer) return;
            _persistTimer = setTimeout(() => {
                _persistQueue.forEach((v, k) => {
                    try { localStorage.setItem(k, v); } catch (e) { console.warn('localStorage set error', e); }
                });
                _persistQueue.clear();
                _persistTimer = null;
            }, 500);
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clockTime').textContent = now.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
            document.getElementById('clockDate').textContent = now.toLocaleDateString('ru-RU', { weekday:'long', year:'numeric', month:'long', day:'numeric' }).replace(/^./, s => s.toUpperCase());
        }
        let _clockInterval = null;
        function startClock() { if (_clockInterval) return; updateClock(); _clockInterval = setInterval(updateClock, 1000); }
        function stopClock() { if (_clockInterval) { clearInterval(_clockInterval); _clockInterval = null; } }
        document.addEventListener('visibilitychange', () => { if (document.hidden) stopClock(); else startClock(); });
        startClock();

        function loadWallpaper(index) {
            const img = new Image();
            img.src = 'wallpapers/' + index + '.jpg';
            img.onload = () => {
                document.body.style.backgroundImage = 'url(' + img.src + ')';
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                currentWallpaper = index;
                scheduleLocalStorageWrite('kaifbrowser_wallpaper', String(index));
                updateWallpaperThumbs();
            };
            img.onerror = () => {
                document.body.style.backgroundImage = 'none';
                document.body.style.backgroundColor = '#0f0f0f';
            };
        }

        function toggleWallpaperPanel() {
            wallpaperPanel.classList.toggle('show');
            if (wallpaperPanel.classList.contains('show')) renderWallpaperThumbs();
        }

        function renderWallpaperThumbs() {
            wallpaperPanel.innerHTML = '';
            for (let i = 1; i <= WALLPAPER_COUNT; i++) {
                const img = document.createElement('img');
                img.className = 'wallpaper-thumb' + (i === currentWallpaper ? ' active' : '');
                img.width = 60; img.height = 40; img.loading = 'lazy';
                img.alt = 'Обои ' + i;
                img.title = 'Обои ' + i;
                img.src = 'wallpapers/' + i + '.jpg';
                img.onclick = () => loadWallpaper(i);
                wallpaperPanel.appendChild(img);
            }
        }

        function updateWallpaperThumbs() {
            document.querySelectorAll('.wallpaper-thumb').forEach((el, idx) => {
                el.classList.toggle('active', (idx + 1) === currentWallpaper);
            });
        }

        function addSearchHistory(query) {
            if (!query.trim()) return;
            searchHistoryItems = searchHistoryItems.filter(item => item !== query);
            searchHistoryItems.unshift(query);
            if (searchHistoryItems.length > 20) searchHistoryItems.pop();
            scheduleLocalStorageWrite('kaifbrowser_searchHistory', JSON.stringify(searchHistoryItems));
            renderSearchHistory();
        }

        function renderSearchHistory() {
            // simple, small list — rebuild is fine but keep it lightweight
            searchHistory.innerHTML = '';
            const frag = document.createDocumentFragment();
            searchHistoryItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.textContent = item;
                div.onclick = () => { searchInput.value = item; search(true); };
                frag.appendChild(div);
            });
            searchHistory.appendChild(frag);
        }

        function addDownload(filename, path, state) {
            state = state || 'completed';
            downloads.push({ filename: filename, path: path, state: state, time: Date.now() });
            if (downloads.length > 50) downloads.shift();
            scheduleLocalStorageWrite('kaifbrowser_downloads', JSON.stringify(downloads));
            renderDownloads();
        }

        function renderDownloads() {
            downloadsList.innerHTML = '';
            if (downloads.length === 0) {
                downloadsList.innerHTML = '<div style="color:rgba(255,255,255,0.4); font-size:13px;">Нет загрузок</div>';
                return;
            }
            const frag = document.createDocumentFragment();
            downloads.slice().reverse().forEach(d => {
                const item = document.createElement('div');
                item.className = 'download-item';
                const statusIcon = d.state === 'completed' ? '✅' : (d.state === 'progressing' ? '⏳' : '❌');
                const filenameSpan = document.createElement('span');
                filenameSpan.className = 'filename';
                filenameSpan.title = d.filename;
                filenameSpan.textContent = d.filename;
                const statusSpan = document.createElement('span');
                statusSpan.className = 'status';
                statusSpan.textContent = statusIcon;
                const openBtn = document.createElement('button');
                openBtn.className = 'open-folder';
                openBtn.textContent = '📂';
                openBtn.onclick = () => openDownloadFolder(d.path);
                item.appendChild(filenameSpan);
                item.appendChild(statusSpan);
                item.appendChild(openBtn);
                frag.appendChild(item);
            });
            downloadsList.appendChild(frag);
        }

        function toggleDownloadsPanel() {
            downloadsPanel.classList.toggle('show');
            if (downloadsPanel.classList.contains('show')) renderDownloads();
        }

        async function openDownloadFolder(folderPath) {
            const lastSlash = folderPath.lastIndexOf('\\');
            const dirPath = lastSlash > 0 ? folderPath.substring(0, lastSlash) : folderPath;
            await electronAPI.openDownloadFolder(dirPath);
        }

        // Persist tabs with debounce
        function saveTabsImmediate() {
            const data = tabs.map(t => ({ id: t.id, url: t.url, title: t.title }));
            try {
                scheduleLocalStorageWrite('kaifbrowser_tabs', JSON.stringify(data));
                scheduleLocalStorageWrite('kaifbrowser_activeTab', String(activeTab || ''));
            } catch (e) { console.warn('saveTabs error', e); }
        }
        function saveTabs() { saveTabsImmediate(); }

        function loadTabs() {
            const saved = localStorage.getItem('kaifbrowser_tabs');
            const active = localStorage.getItem('kaifbrowser_activeTab');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    parsed.forEach(t => { tabId++; tabs.push({ id: 'tab-' + tabId, url: t.url || '', title: t.title || 'Новая вкладка' }); });
                    renderTabs();
                    if (active && tabs.find(t => t.id === active)) switchTab(active);
                    else if (tabs.length) switchTab(tabs[0].id);
                    else newTab();
                } catch (e) { console.warn('loadTabs parse error', e); newTab(); }
            } else newTab();
        }

        function newTab(url, title) {
            url = url || '';
            title = title || 'Новая вкладка';
            tabId++;
            const id = 'tab-' + tabId;
            tabs.push({ id: id, url: url, title: title });
            renderTabs();
            switchTab(id);
            if (url) navigateTo(url, false);
            saveTabs();
            return id;
        }

        function closeTab(id, e) {
            if (e) e.stopPropagation();
            const idx = tabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            tabs.splice(idx, 1);
            if (tabs.length === 0) newTab();
            else if (activeTab === id) {
                const newIdx = Math.min(idx, tabs.length - 1);
                switchTab(tabs[newIdx].id);
            }
            renderTabs();
            saveTabs();
        }

        function switchTab(id) {
            activeTab = id;
            const tab = tabs.find(t => t.id === id);
            if (!tab) return;
            urlBar.value = tab.url || '';
            if (tab.url) {
                welcome.style.display = 'none';
                webviewContainer.style.display = 'block';
                setTimeout(() => { try { webview.src = tab.url; } catch (e) {} }, 50);
            } else {
                welcome.style.display = 'flex';
                webviewContainer.style.display = 'none';
                webview.src = '';
                searchInput.value = '';
            }
            renderTabs();
            saveTabs();
            setTimeout(updateNavButtons, 100);
            setTimeout(() => {
                const activeEl = tabsContainer.querySelector('.tab.active');
                if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }, 50);
            updateScrollButtonsThrottled();
        }

        function renderTabs() {
            tabsContainer.innerHTML = '';
            const frag = document.createDocumentFragment();
            tabs.forEach(tab => {
                const div = document.createElement('div');
                div.className = 'tab' + (tab.id === activeTab ? ' active' : '');
                div.onclick = () => switchTab(tab.id);
                const titleSpan = document.createElement('span');
                titleSpan.className = 'tab-title';
                titleSpan.textContent = tab.title || 'Новая вкладка';
                const closeBtn = document.createElement('button');
                closeBtn.className = 'tab-close';
                closeBtn.textContent = '✕';
                closeBtn.onclick = (e) => closeTab(tab.id, e);
                div.appendChild(titleSpan);
                div.appendChild(closeBtn);
                frag.appendChild(div);
            });
            tabsContainer.appendChild(frag);
            updateScrollButtonsThrottled();
        }

        function scrollTabs(direction) {
            tabsContainer.scrollBy({ left: direction * 200, behavior: 'smooth' });
            setTimeout(updateScrollButtonsThrottled, 100);
        }

        function updateScrollButtons() {
            const container = tabsContainer;
            document.getElementById('scrollLeftBtn').disabled = !(container.scrollLeft > 0);
            document.getElementById('scrollRightBtn').disabled = !(container.scrollLeft + container.clientWidth < container.scrollWidth - 2);
        }
        let _rafScheduled = false;
        function updateScrollButtonsThrottled() {
            if (_rafScheduled) return;
            _rafScheduled = true;
            requestAnimationFrame(() => { updateScrollButtons(); _rafScheduled = false; });
        }

        tabsContainer.addEventListener('scroll', () => updateScrollButtonsThrottled(), { passive: true });
        window.addEventListener('resize', updateScrollButtonsThrottled);

        function navigateTo(url, openInNewTab) {
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
            if (openInNewTab) {
                newTab(url, 'Загрузка...');
            } else {
                const tab = tabs.find(t => t.id === activeTab);
                if (tab) { tab.url = url; tab.title = url; }
                welcome.style.display = 'none';
                webviewContainer.style.display = 'block';
                setTimeout(() => { try { webview.src = url; } catch (e) {} }, 50);
                urlBar.value = url;
                renderTabs();
                saveTabs();
                setTimeout(updateNavButtons, 100);
            }
        }

        function navigate() {
            const url = urlBar.value.trim();
            if (!url) return;
            if ((url.includes('.') && !url.includes(' ')) || url.startsWith('http')) {
                navigateTo(url, false);
            } else {
                addSearchHistory(url);
                navigateTo(SEARCH_URL + encodeURIComponent(url), true);
            }
        }

        function goHome() {
            const tab = tabs.find(t => t.id === activeTab);
            if (tab) { tab.url = ''; tab.title = 'Новая вкладка'; }
            welcome.style.display = 'flex';
            webviewContainer.style.display = 'none';
            webview.src = '';
            urlBar.value = '';
            searchInput.value = '';
            renderTabs();
            saveTabs();
            updateNavButtons();
        }

        function goBack() { try { if (webview.canGoBack()) { webview.goBack(); setTimeout(updateNavButtons, 300); } } catch (e) {} }
        function goForward() { try { if (webview.canGoForward()) { webview.goForward(); setTimeout(updateNavButtons, 300); } } catch (e) {} }
        function refresh() { try { loadingIndicator.classList.add('active'); webview.reload(); } catch (e) { loadingIndicator.classList.remove('active'); } }

        function updateNavButtons() {
            try {
                backBtn.disabled = !webview.canGoBack();
                forwardBtn.disabled = !webview.canGoForward();
            } catch (e) { backBtn.disabled = true; forwardBtn.disabled = true; }
        }

        function search(openInNewTab) {
            const query = searchInput.value.trim();
            if (!query) return;
            addSearchHistory(query);
            navigateTo(SEARCH_URL + encodeURIComponent(query), openInNewTab !== false);
        }

        webview.addEventListener('context-menu', (e) => {
            e.preventDefault();
            const x = e.x, y = e.y;
            webview.executeJavaScript(
                '(function(){var el=document.elementFromPoint('+x+','+y+');if(el){var l=el.href||el.getAttribute("href")||"";if(!l&&el.closest){var p=el.closest("a");if(p)l=p.href||"";}return JSON.stringify({link:l});}return JSON.stringify({link:""});})();'
            ).then(function(r){ try { const parsed = JSON.parse(r); electronAPI.showContextMenu(parsed.link); } catch (e) { electronAPI.showContextMenu(''); } }).catch(function(){ electronAPI.showContextMenu(''); });
        });

        // Ensure only one listener per signal from preload (prevent duplicate registrations)
        electronAPI.onOpenNewTab(function(link){ if (link) navigateTo(link, true); });
        electronAPI.onRefresh(function(){ refresh(); });

        electronAPI.onDownloadStarted((data) => {
            addDownload(data.filename, data.path, 'progressing');
        });
        electronAPI.onDownloadProgress((data) => {
            const item = downloads.find(d => d.filename === data.filename && d.path === data.path);
            if (item) {
                item.progress = data.progress;
                renderDownloads();
            }
        });
        electronAPI.onDownloadDone((data) => {
            const item = downloads.find(d => d.filename === data.filename && d.path === data.path);
            if (item) {
                item.state = data.state === 'completed' ? 'completed' : 'cancelled';
                scheduleLocalStorageWrite('kaifbrowser_downloads', JSON.stringify(downloads));
                renderDownloads();
            } else {
                addDownload(data.filename, data.path, data.state);
            }
        });

        async function autoFillForms(url) {
            try {
                const domain = new URL(url).hostname;
                const passwords = await electronAPI.getPasswordsForDomain(domain);
                if (!passwords || Object.keys(passwords).length === 0) return;
                // Inject minimal, idempotent script that fills first matching form once
                const script = '(function(){ if(window.__kaif_autoFillDone) return; window.__kaif_autoFillDone=true; try{ var p=' + JSON.stringify(passwords) + '; var inputs=document.querySelectorAll("input[type=\\"password\\"]"); if(inputs.length===0) return; var pass=inputs[0]; var form=pass.form||pass.closest("form"); if(!form) return; var uname=form.querySelector("input[type=\\"text\\"],input[type=\\"email\\"],input[name]"); if(uname){ var firstUser=Object.keys(p)[0]; if(firstUser) uname.value=firstUser; } var firstPassVal=Object.values(p)[0]; if(firstPassVal) pass.value=firstPassVal; }catch(e){} })();';
                webview.executeJavaScript(script).catch(e => {});
            } catch (e) { console.warn('Автозаполнение ошибка:', e); }
        }

        function injectPasswordCapture() {
            const script = '(function(){ if(window.__kaif_inject_done) return; window.__kaif_inject_done=true; try{ document.querySelectorAll("form").forEach(function(f){ if(f.dataset && f.dataset.kaifBound) return; f.dataset.kaifBound = "1"; f.addEventListener("submit",function(){ try{ var u=this.querySelector("input[type=\\"text\\"],input[type=\\"email\\"],input[name]"); var p=this.querySelector("input[type=\\"password\\"]"); var username=(u && u.value) || ""; var password=(p && p.value) || ""; var domain=location.hostname; window.postMessage({ type: 'save-password', domain: domain, username: username, password: password }, '*'); }catch(e){} }); }); }catch(e){} })();';
            webview.executeJavaScript(script).catch(e => {});
        }

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'save-password') {
                electronAPI.savePassword(event.data.domain, event.data.username, event.data.password);
                console.log('Пароль сохранён для', event.data.domain);
            }
        });

        webview.addEventListener('did-start-loading', () => loadingIndicator.classList.add('active'));
        webview.addEventListener('did-stop-loading', () => { loadingIndicator.classList.remove('active'); updateNavButtons(); });
        webview.addEventListener('did-navigate', (e) => {
            const url = e.url;
            urlBar.value = url;
            const tab = tabs.find(t => t.id === activeTab);
            if (tab) { tab.url = url; tab.title = url; renderTabs(); saveTabs(); }
            updateNavButtons();
            // Prefer dom-ready to inject scripts; autoFill and capture are idempotent
            setTimeout(() => { autoFillForms(url); setTimeout(injectPasswordCapture, 300); }, 500);
        });
        webview.addEventListener('page-title-updated', (e) => {
            const tab = tabs.find(t => t.id === activeTab);
            if (tab && e.title) { tab.title = e.title; renderTabs(); saveTabs(); }
        });
        webview.addEventListener('new-window', (e) => { e.preventDefault(); if (e.url) navigateTo(e.url, true); });
        webview.addEventListener('dom-ready', () => {
            updateNavButtons();
            const url = webview.getURL();
            if (url) { autoFillForms(url); setTimeout(injectPasswordCapture, 300); }
        });
        webview.addEventListener('did-fail-load', (e) => { loadingIndicator.classList.remove('active'); console.warn('Ошибка загрузки:', e); });

        window.addEventListener('beforeunload', () => saveTabs());

        const savedWallpaper = parseInt(localStorage.getItem('kaifbrowser_wallpaper')) || 1;
        loadWallpaper(savedWallpaper);
        renderSearchHistory();
        renderDownloads();
        loadTabs();
        setTimeout(updateScrollButtonsThrottled, 100);

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.downloads-panel') && !e.target.closest('.toolbar-btn')) {
                downloadsPanel.classList.remove('show');
            }
        });
    </script>
</body>
</html>

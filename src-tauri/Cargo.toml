[package]
name = "kaif-browser"
version = "3.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = "=1.5.6"

[dependencies]
tauri = { version = "3.0.0", features = ["api-all", "shell-open", "dialog-open", "fs-read-dir", "fs-write-file", "fs-read-file"] }
serde = "1.0"
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 's'
lto = true
codegen-units = 1
panic = 'abort'



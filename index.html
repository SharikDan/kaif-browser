<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>KaifBrowser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a0a0a 50%, #0f0f0f 100%);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Title Bar */
        .titlebar {
            background: rgba(0,0,0,0.95);
            border-bottom: 2px solid #ff0040;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            -webkit-app-region: drag;
        }
        
        .logo {
            color: #ff0040;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(255,0,64,0.7);
        }
        
        .window-controls button {
            -webkit-app-region: no-drag;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: rgba(255,255,255,0.8);
            cursor: pointer;
            font-size: 16px;
            margin-left: 8px;
            transition: all 0.2s;
        }
        
        .window-controls button:hover {
            background: rgba(255,0,64,0.3);
            color: white;
        }
        
        .window-controls button.close:hover {
            background: #ff0040;
        }
        
        /* Tab Bar */
        .tabbar {
            background: rgba(0,0,0,0.8);
            padding: 10px 15px 0;
            display: flex;
            align-items: flex-end;
            gap: 5px;
            border-bottom: 1px solid rgba(255,0,64,0.3);
        }
        
        .tab {
            background: rgba(255,0,64,0.15);
            border: 1px solid rgba(255,0,64,0.4);
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            padding: 10px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 220px;
            transition: all 0.3s;
        }
        
        .tab:hover {
            background: rgba(255,0,64,0.25);
        }
        
        .tab.active {
            background: rgba(255,0,64,0.4);
            border-color: #ff0040;
            box-shadow: 0 -2px 10px rgba(255,0,64,0.4);
        }
        
        .tab-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
        }
        
        .tab-close {
            width: 20px;
            height: 20px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .tab-close:hover {
            background: rgba(255,0,64,0.6);
            color: white;
        }
        
        .new-tab {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 10px 10px 0 0;
            background: rgba(255,0,64,0.2);
            color: white;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s;
        }
        
        .new-tab:hover {
            background: rgba(255,0,64,0.4);
            transform: translateY(-2px);
        }
        
        /* Navigation Bar */
        .navbar {
            background: rgba(0,0,0,0.85);
            padding: 12px 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .nav-btn {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 10px;
            background: rgba(255,0,64,0.25);
            color: #ff0040;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }
        
        .nav-btn:hover {
            background: #ff0040;
            color: white;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255,0,64,0.5);
        }
        
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }
        
        .url-bar {
            flex: 1;
            height: 38px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,0,64,0.4);
            border-radius: 10px;
            padding: 0 15px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        
        .url-bar:focus {
            border-color: #ff0040;
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 15px rgba(255,0,64,0.3);
        }
        
        .search-select {
            position: relative;
        }
        
        .search-btn {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 10px;
            background: rgba(255,0,64,0.25);
            color: #ff0040;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }
        
        .search-btn:hover {
            background: #ff0040;
            color: white;
        }
        
        .search-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 10px;
            background: rgba(0,0,0,0.95);
            border: 2px solid #ff0040;
            border-radius: 10px;
            padding: 8px;
            display: none;
            z-index: 1000;
            min-width: 180px;
            box-shadow: 0 5px 20px rgba(255,0,64,0.4);
        }
        
        .search-menu.show {
            display: block;
        }
        
        .search-option {
            padding: 12px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .search-option:hover {
            background: rgba(255,0,64,0.3);
        }
        
        .search-option.active {
            background: rgba(255,0,64,0.4);
        }
        
        /* Welcome Screen */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a0a0a 50%, #0f0f0f 100%);
        }
        
        .welcome-box {
            text-align: center;
            padding: 60px;
            background: rgba(0,0,0,0.4);
            border: 2px solid #ff0040;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255,0,64,0.4);
        }
        
        .welcome h1 {
            font-size: 72px;
            color: #ff0040;
            text-shadow: 0 0 40px rgba(255,0,64,0.8);
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 40px rgba(255,0,64,0.8); }
            50% { text-shadow: 0 0 60px rgba(255,0,64,1); }
        }
        
        .welcome p {
    font-size: 20px;
    color: rgba(255,255,255,0.7);
    margin-bottom: 40px;
}

.clock-container {
    margin-bottom: 40px;
    text-align: center;
}

.time {
    font-size: 96px;
    font-weight: bold;
    color: #ff0040;
    text-shadow: 0 0 40px rgba(255,0,64,0.8);
    margin-bottom: 10px;
    animation: glow 2s ease-in-out infinite;
}

.date {
    font-size: 24px;
    color: rgba(255,255,255,0.8);
}

@keyframes glow {
    0%, 100% { text-shadow: 0 0 40px rgba(255,0,64,0.8); }
    50% { text-shadow: 0 0 60px rgba(255,0,64,1); }
}
        
        .search-box {
            display: flex;
            gap: 12px;
            max-width: 650px;
            margin: 20px auto;
        }
        
        .search-input {
            flex: 1;
            height: 55px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,0,64,0.4);
            border-radius: 12px;
            padding: 0 25px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
        }
        
        .search-input:focus {
            border-color: #ff0040;
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 20px rgba(255,0,64,0.4);
        }
        
        .search-btn-main {
            height: 55px;
            padding: 0 35px;
            background: linear-gradient(135deg, #ff0040, #ff0066);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .search-btn-main:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 25px rgba(255,0,64,0.6);
        }
        
        .quick-links {
            display: flex;
            gap: 15px;
            margin-top: 50px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .quick-link {
            padding: 14px 28px;
            background: rgba(255,0,64,0.2);
            border: 2px solid rgba(255,0,64,0.4);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .quick-link:hover {
            background: rgba(255,0,64,0.4);
            border-color: #ff0040;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(255,0,64,0.4);
        }
        
        /* WebView */
        .webview-container {
            flex: 1;
            display: none;
            background: white;
        }
        
        webview {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- Title Bar -->
    <div class="titlebar">
        <div class="logo">ðŸ”¥ KaifBrowser</div>
        <div class="window-controls">
            <button onclick="minimizeWindow()">âˆ’</button>
            <button onclick="maximizeWindow()">â–¡</button>
            <button class="close" onclick="closeWindow()">Ã—</button>
        </div>
    </div>
    
    <!-- Tab Bar -->
    <div class="tabbar" id="tabbar">
        <button class="new-tab" onclick="newTab()">+</button>
    </div>
    
    <!-- Navigation Bar -->
    <div class="navbar">
        <button class="nav-btn" id="backBtn" onclick="goBack()" disabled>â†</button>
        <button class="nav-btn" id="forwardBtn" onclick="goForward()" disabled>â†’</button>
        <button class="nav-btn" onclick="refresh()">â†»</button>
        <button class="nav-btn" onclick="goHome()">ðŸ </button>
        <input type="text" class="url-bar" id="urlBar" placeholder="Enter URL or search..." onkeypress="if(event.key==='Enter')navigate()">
        <button class="nav-btn" onclick="navigate()">âžœ</button>
        
        <div class="search-select">
            <button class="search-btn" onclick="toggleSearchMenu()">ðŸ”</button>
            <div class="search-menu" id="searchMenu">
                <div class="search-option active" data-engine="google" onclick="selectEngine('google')">
                    <span>ðŸ”</span><span>Google</span>
                </div>
                <div class="search-option" data-engine="yandex" onclick="selectEngine('yandex')">
                    <span>Ð¯</span><span>Yandex</span>
                </div>
                <div class="search-option" data-engine="duckduckgo" onclick="selectEngine('duckduckgo')">
                    <span>ðŸ¦†</span><span>DuckDuckGo</span>
                </div>
                <div class="search-option" data-engine="bing" onclick="selectEngine('bing')">
                    <span>ðŸ…±ï¸</span><span>Bing</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Welcome Screen -->
        <!-- Welcome Screen -->
    <div class="welcome" id="welcome">
        <div class="welcome-box">
            <div class="clock-container">
                <div class="time" id="clockTime">00:00:00</div>
                <div class="date" id="clockDate">Loading...</div>
            </div>
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="Search..." onkeypress="if(event.key==='Enter')search()">
                <button class="search-btn-main" onclick="search()">Search</button>
            </div>
        </div>
    </div>
    </div>
    
    <!-- WebView -->
    <div class="webview-container" id="webviewContainer">
        <webview id="webview" partition="persist:kaifbrowser"></webview>
    </div>
    
    <script>
        const engines = {
            google: { name: 'Google', icon: 'ðŸ”', url: 'https://www.google.com/search?q=' },
            yandex: { name: 'Yandex', icon: 'Ð¯', url: 'https://yandex.ru/search/?text=' },
            duckduckgo: { name: 'DuckDuckGo', icon: 'ðŸ¦†', url: 'https://duckduckgo.com/?q=' },
            bing: { name: 'Bing', icon: 'ðŸ…±ï¸', url: 'https://www.bing.com/search?q=' }
        };
        
        let currentEngine = 'google';
        let tabs = [];
        let activeTab = null;
        let tabId = 0;
        
        const webview = document.getElementById('webview');
        const welcome = document.getElementById('welcome');
        const webviewContainer = document.getElementById('webviewContainer');
        const urlBar = document.getElementById('urlBar');
        const tabbar = document.getElementById('tabbar');
        
        function newTab(url = '', title = 'New Tab') {
            tabId++;
            const id = 'tab-' + tabId;
            tabs.push({ id, url, title });
            renderTabs();
            switchTab(id);
            if (url) navigateTo(url);
            return id;
        }
        
        function closeTab(id, e) {
            if (e) e.stopPropagation();
            const idx = tabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            tabs.splice(idx, 1);
            if (tabs.length === 0) {
                newTab();
            } else if (activeTab === id) {
                switchTab(tabs[Math.min(idx, tabs.length-1)].id);
            }
            renderTabs();
        }
        
        function switchTab(id) {
            activeTab = id;
            const tab = tabs.find(t => t.id === id);
            if (tab) {
                urlBar.value = tab.url;
                if (tab.url) {
                    welcome.style.display = 'none';
                    webviewContainer.style.display = 'block';
                    webview.src = tab.url;
                } else {
                    welcome.style.display = 'flex';
                    webviewContainer.style.display = 'none';
                }
            }
            renderTabs();
        }
        
        function renderTabs() {
            tabbar.querySelectorAll('.tab').forEach(el => el.remove());
            tabs.forEach(tab => {
                const div = document.createElement('div');
                div.className = 'tab' + (tab.id === activeTab ? ' active' : '');
                div.onclick = () => switchTab(tab.id);
                div.innerHTML = '<span class="tab-title">' + tab.title + '</span><button class="tab-close" onclick="closeTab(\'' + tab.id + '\',event)">Ã—</button>';
                tabbar.insertBefore(div, tabbar.lastElementChild);
            });
        }
        
        function navigateTo(url) {
            if (!url.startsWith('http')) url = 'https://' + url;
            welcome.style.display = 'none';
            webviewContainer.style.display = 'block';
            webview.src = url;
            urlBar.value = url;
            const tab = tabs.find(t => t.id === activeTab);
            if (tab) { tab.url = url; tab.title = url; }
            renderTabs();
        }
        
        function navigate() {
            const url = urlBar.value.trim();
            if (!url) return;
            if (url.includes('.') && !url.includes(' ')) {
                navigateTo(url);
            } else {
                search(url);
            }
        }
        
        function goHome() {
            welcome.style.display = 'flex';
            webviewContainer.style.display = 'none';
            webview.src = '';
            urlBar.value = '';
            const tab = tabs.find(t => t.id === activeTab);
            if (tab) { tab.url = ''; tab.title = 'New Tab'; }
            renderTabs();
        }
        
        function goBack() { if (webview.canGoBack()) webview.goBack(); }
        function goForward() { if (webview.canGoForward()) webview.goForward(); }
        function refresh() { webview.reload(); }
        
        function search(query) {
            if (!query) query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            navigateTo(engines[currentEngine].url + encodeURIComponent(query));
        }
        
        function toggleSearchMenu() {
            document.getElementById('searchMenu').classList.toggle('show');
        }
        
        function selectEngine(engine) {
            currentEngine = engine;
            document.querySelectorAll('.search-option').forEach(el => el.classList.remove('active'));
            document.querySelector('[data-engine="' + engine + '"]').classList.add('active');
            document.getElementById('searchMenu').classList.remove('show');
            document.getElementById('searchInput').placeholder = 'Search with ' + engines[engine].name + '...';
        }
        
        function minimizeWindow() { require('electron').remote.getCurrentWindow().minimize(); }
        function maximizeWindow() { const w = require('electron').remote.getCurrentWindow(); w.isMaximized() ? w.unmaximize() : w.maximize(); }
        function closeWindow() { require('electron').remote.getCurrentWindow().close(); }
        
        webview.addEventListener('did-navigate', e => {
            urlBar.value = e.url;
            const tab = tabs.find(t => t.id === activeTab);
            if (tab) { tab.url = e.url; tab.title = e.url; renderTabs(); }
        });
        
        webview.addEventListener('page-title-updated', e => {
            const tab = tabs.find(t => t.id === activeTab);
            if (tab && e.title) { tab.title = e.title; renderTabs(); }
        });
        
        document.addEventListener('click', e => {
            if (!e.target.closest('.search-select')) document.getElementById('searchMenu').classList.remove('show');
        });
        
                
        // Clock
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
            const dateStr = now.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            document.getElementById('clockTime').textContent = timeStr;
            document.getElementById('clockDate').textContent = dateStr;
        }
        updateClock();
        setInterval(updateClock, 1000);
        // Init
        newTab();
    </script>
</body>
</html>

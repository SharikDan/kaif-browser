[package]
name = "kaif-browser"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = ""
repository = ""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.8", features = ["api-all", "window-transparent", "window-decorations", "shell-open", "dialog-open", "fs-read-dir", "fs-write-text-file", "fs-read-text-file"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Явно указываем версии для brotli, чтобы избежать конфликта alloc-no-stdlib
brotli = "7.0.0"
alloc-no-stdlib = "2.0.4"
alloc-stdlib = "0.2.3"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Resolver для устранения конфликтов зависимостей
[profile.release]
opt-level = 's'
lto = true
codegen-units = 1
panic = 'abort'

[workspace]
resolver = "2"

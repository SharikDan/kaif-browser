<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>KaifBrowser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #0f0f0f 0%, #1a0a0a 50%, #0f0f0f 100%); color: white; font-family: 'Segoe UI', Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .titlebar { background: rgba(0,0,0,0.95); border-bottom: 2px solid #ff0040; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; -webkit-app-region: drag; }
        .logo { color: #ff0040; font-weight: bold; font-size: 18px; text-shadow: 0 0 10px rgba(255,0,64,0.7); }
        .window-controls button { -webkit-app-region: no-drag; width: 32px; height: 32px; border: none; border-radius: 6px; background: transparent; color: rgba(255,255,255,0.8); cursor: pointer; font-size: 16px; margin-left: 8px; transition: all 0.2s; }
        .window-controls button:hover { background: rgba(255,0,64,0.3); color: white; }
        .window-controls button.close:hover { background: #ff0040; }
        .tabbar { background: rgba(0,0,0,0.8); padding: 10px 10px 0 10px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid rgba(255,0,64,0.3); position: relative; }
        .tabs-scroll-container { flex: 1; overflow-x: auto; overflow-y: hidden; display: flex; gap: 4px; padding-bottom: 4px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .tabs-scroll-container::-webkit-scrollbar { height: 0; }
        .tab { flex-shrink: 0; background: rgba(255,0,64,0.15); border: 1px solid rgba(255,0,64,0.4); border-bottom: none; border-radius: 10px 10px 0 0; padding: 8px 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; max-width: 180px; transition: all 0.2s; white-space: nowrap; }
        .tab:hover { background: rgba(255,0,64,0.25); }
        .tab.active { background: rgba(255,0,64,0.4); border-color: #ff0040; box-shadow: 0 -2px 10px rgba(255,0,64,0.4); }
        .tab-title { flex: 1; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
        .tab-close { width: 20px; height: 20px; border: none; border-radius: 50%; background: transparent; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 14px; flex-shrink: 0; }
        .tab-close:hover { background: rgba(255,0,64,0.6); color: white; }
        .tab-nav-btn { width: 28px; height: 28px; border: none; border-radius: 50%; background: rgba(255,0,64,0.3); color: white; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; -webkit-app-region: no-drag; }
        .tab-nav-btn:hover { background: #ff0040; transform: scale(1.1); }
        .tab-nav-btn:disabled { opacity: 0.3; cursor: default; transform: none; }
        .new-tab { width: 35px; height: 35px; border: none; border-radius: 10px 10px 0 0; background: rgba(255,0,64,0.2); color: white; cursor: pointer; font-size: 20px; transition: all 0.2s; flex-shrink: 0; -webkit-app-region: no-drag; }
        .new-tab:hover { background: rgba(255,0,64,0.4); transform: translateY(-2px); }
        .navbar { background: rgba(0,0,0,0.85); padding: 12px 15px; display: flex; gap: 10px; align-items: center; }
        .nav-btn { width: 38px; height: 38px; border: none; border-radius: 10px; background: rgba(255,0,64,0.25); color: #ff0040; cursor: pointer; font-size: 18px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .nav-btn:hover { background: #ff0040; color: white; transform: scale(1.1); box-shadow: 0 0 15px rgba(255,0,64,0.5); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        .url-bar { flex: 1; height: 38px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,0,64,0.4); border-radius: 10px; padding: 0 15px; color: white; font-size: 14px; outline: none; transition: all 0.2s; }
        .url-bar:focus { border-color: #ff0040; background: rgba(255,255,255,0.15); box-shadow: 0 0 15px rgba(255,0,64,0.3); }
        .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f0f0f 0%, #1a0a0a 50%, #0f0f0f 100%); }
        .welcome-content { text-align: center; width: 100%; max-width: 700px; padding: 40px; }
        .clock-container { margin-bottom: 50px; text-align: center; }
        .time { font-size: 120px; font-weight: 300; color: #ff0040; text-shadow: 0 0 50px rgba(255,0,64,0.8); letter-spacing: 4px; line-height: 1; animation: glow 3s ease-in-out infinite; }
        .date { font-size: 22px; color: rgba(255,255,255,0.7); margin-top: 15px; letter-spacing: 1px; }
        @keyframes glow { 0%, 100% { text-shadow: 0 0 50px rgba(255,0,64,0.8); } 50% { text-shadow: 0 0 80px rgba(255,0,64,1), 0 0 100px rgba(255,0,64,0.6); } }
        .search-box { display: flex; gap: 12px; max-width: 650px; margin: 0 auto; }
        .search-input { flex: 1; height: 55px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,0,64,0.4); border-radius: 12px; padding: 0 25px; color: white; font-size: 16px; outline: none; transition: all 0.2s; }
        .search-input:focus { border-color: #ff0040; background: rgba(255,255,255,0.15); box-shadow: 0 0 20px rgba(255,0,64,0.4); }
        .search-btn-main { height: 55px; padding: 0 35px; background: linear-gradient(135deg, #ff0040, #ff0066); border: none; border-radius: 12px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .search-btn-main:hover { transform: scale(1.05); box-shadow: 0 5px 25px rgba(255,0,64,0.6); }
        .loading-indicator { position: fixed; top: 76px; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #ff0040, transparent); display: none; z-index: 10000; }
        .loading-indicator.active { display: block; animation: loading 1.5s ease-in-out infinite; }
        @keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .webview-container { flex: 1; display: none; background: white; }
        webview { width: 100%; height: 100%; border: none; }
        .download-indicator { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.9); padding: 15px 25px; border-radius: 12px; border: 2px solid #ff0040; color: white; display: none; z-index: 9999; box-shadow: 0 5px 25px rgba(255,0,64,0.4); min-width: 280px; backdrop-filter: blur(4px); }
        .download-indicator.show { display: block; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .download-info { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .download-icon { color: #ff0040; font-size: 20px; }
        .download-filename { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .download-percent { font-weight: bold; color: #ff0040; font-size: 14px; }
        .download-progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        .download-progress-fill { height: 100%; background: linear-gradient(90deg, #ff0040, #ff0066); width: 0%; transition: width 0.3s; box-shadow: 0 0 10px rgba(255,0,64,0.6); }
    </style>
</head>
<body>
    <div class="loading-indicator" id="loadingIndicator"></div>
    <div class="download-indicator" id="downloadIndicator">
        <div class="download-info">
            <span class="download-icon">⬇</span>
            <span class="download-filename" id="downloadFilename">Файл</span>
            <span class="download-percent" id="downloadPercent">0%</span>
        </div>
        <div class="download-progress-bar">
            <div class="download-progress-fill" id="downloadProgressFill"></div>
        </div>
    </div>

    <div class="titlebar">
        <div class="logo">
            <svg style="width:20px;height:20px;vertical-align:middle;margin-right:8px" viewBox="0 0 24 24" fill="#ff0040">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            KaifBrowser
        </div>
        <div class="window-controls">
            <button onclick="window.electronAPI.minimize()" title="Свернуть"><svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13H5v-2h14v2z"/></svg></button>
            <button onclick="window.electronAPI.maximize()" title="Развернуть"><svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="currentColor"><path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H6V6h12v12z"/></svg></button>
            <button class="close" onclick="window.electronAPI.close()" title="Закрыть"><svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
        </div>
    </div>

    <div class="tabbar" id="tabbar">
        <button class="tab-nav-btn" id="scrollLeftBtn" onclick="scrollTabs(-1)" title="Влево">◀</button>
        <div class="tabs-scroll-container" id="tabsContainer"></div>
        <button class="tab-nav-btn" id="scrollRightBtn" onclick="scrollTabs(1)" title="Вправо">▶</button>
        <button class="new-tab" onclick="newTab()" title="Новая вкладка">+</button>
    </div>

    <div class="navbar">
        <button class="nav-btn" id="backBtn" onclick="goBack()" disabled title="Назад"><svg style="width:20px;height:20px" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
        <button class="nav-btn" id="forwardBtn" onclick="goForward()" disabled title="Вперед"><svg style="width:20px;height:20px" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg></button>
        <button class="nav-btn" onclick="refresh()" title="Обновить"><svg style="width:20px;height:20px" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
        <button class="nav-btn" onclick="goHome()" title="Домой"><svg style="width:20px;height:20px" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
        <input type="text" class="url-bar" id="urlBar" placeholder="Введите URL или поиск..." onkeypress="if(event.key==='Enter')navigate()">
        <button class="nav-btn" onclick="navigate()" title="Перейти"><svg style="width:20px;height:20px" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg></button>
    </div>

    <div class="welcome" id="welcome">
        <div class="welcome-content">
            <div class="clock-container">
                <div class="time" id="clockTime">00:00:00</div>
                <div class="date" id="clockDate">Загрузка...</div>
            </div>
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск в Google..." onkeypress="if(event.key==='Enter')search(true)">
                <button class="search-btn-main" onclick="search(true)">Поиск</button>
            </div>
        </div>
    </div>

    <div class="webview-container" id="webviewContainer">
        <webview id="webview" partition="persist:kaifbrowser" webpreferences="contextIsolation=no,nodeIntegration=yes"></webview>
    </div>

    <script>
        const SEARCH_URL = 'https://www.google.com/search?q=';
        let tabs = [];
        let activeTab = null;
        let tabId = 0;
        const webview = document.getElementById('webview');
        const welcome = document.getElementById('welcome');
        const webviewContainer = document.getElementById('webviewContainer');
        const urlBar = document.getElementById('urlBar');
        const tabsContainer = document.getElementById('tabsContainer');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const backBtn = document.getElementById('backBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const searchInput = document.getElementById('searchInput');
        const scrollLeftBtn = document.getElementById('scrollLeftBtn');
        const scrollRightBtn = document.getElementById('scrollRightBtn');

        function updateClock() {
            const now = new Date();
            document.getElementById('clockTime').textContent = now.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
            document.getElementById('clockDate').textContent = now.toLocaleDateString('ru-RU', { weekday:'long', year:'numeric', month:'long', day:'numeric' }).replace(/^./, str => str.toUpperCase());
        }
        updateClock();
        setInterval(updateClock, 1000);

        function saveTabs() {
            const data = tabs.map(t => ({ id: t.id, url: t.url, title: t.title }));
            localStorage.setItem('kaifbrowser_tabs', JSON.stringify(data));
            localStorage.setItem('kaifbrowser_activeTab', activeTab);
        }

        function loadTabs() {
            const saved = localStorage.getItem('kaifbrowser_tabs');
            const active = localStorage.getItem('kaifbrowser_activeTab');
            if (saved) {
                const parsed = JSON.parse(saved);
                parsed.forEach(t => {
                    tabId++;
                    tabs.push({ id: 'tab-' + tabId, url: t.url || '', title: t.title || 'Новая вкладка' });
                });
                renderTabs();
                if (active && tabs.find(t => t.id === active)) {
                    switchTab(active);
                } else if (tabs.length) {
                    switchTab(tabs[0].id);
                } else {
                    newTab();
                }
            } else {
                newTab();
            }
        }

        function newTab(url = '', title = 'Новая вкладка') {
            tabId++;
            const id = 'tab-' + tabId;
            tabs.push({ id, url, title });
            renderTabs();
            switchTab(id);
            if (url) navigateTo(url, false);
            saveTabs();
            return id;
        }

        function closeTab(id, e) {
            if (e) e.stopPropagation();
            const idx = tabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            tabs.splice(idx, 1);
            if (tabs.length === 0) { newTab(); }
            else if (activeTab === id) {
                const newIdx = Math.min(idx, tabs.length - 1);
                switchTab(tabs[newIdx].id);
            }
            renderTabs();
            saveTabs();
        }

        function switchTab(id) {
            activeTab = id;
            const tab = tabs.find(t => t.id === id);
            if (!tab) return;
            urlBar.value = tab.url || '';
            if (tab.url) {
                welcome.style.display = 'none';
                webviewContainer.style.display = 'block';
                setTimeout(() => {
                    try { webview.src = tab.url; } catch (e) { console.warn(e); }
                }, 50);
            } else {
                welcome.style.display = 'flex';
                webviewContainer.style.display = 'none';
                webview.src = '';
                searchInput.value = '';
            }
            renderTabs();
            saveTabs();
            setTimeout(updateNavButtons, 100);
            setTimeout(() => {
                const activeEl = tabsContainer.querySelector('.tab.active');
                if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }, 50);
            updateScrollButtons();
        }

        function renderTabs() {
            tabsContainer.innerHTML = '';
            tabs.forEach(tab => {
                const div = document.createElement('div');
                div.className = 'tab' + (tab.id === activeTab ? ' active' : '');
                div.onclick = () => switchTab(tab.id);
                div.innerHTML = '<span class="tab-title">' + (tab.title || 'Новая вкладка') + '</span><button class="tab-close" onclick="closeTab(\'' + tab.id + '\',event)">✕</button>';
                tabsContainer.appendChild(div);
            });
            updateScrollButtons();
        }

        function scrollTabs(direction) {
            tabsContainer.scrollBy({ left: direction * 200, behavior: 'smooth' });
            setTimeout(updateScrollButtons, 100);
        }

        function updateScrollButtons() {
            const container = tabsContainer;
            scrollLeftBtn.disabled = !(container.scrollLeft > 0);
            scrollRightBtn.disabled = !(container.scrollLeft + container.clientWidth < container.scrollWidth - 2);
        }

        tabsContainer.addEventListener('scroll', updateScrollButtons);
        window.addEventListener('resize', updateScrollButtons);

        function navigateTo(url, openInNewTab = false) {
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
            if (openInNewTab) {
                newTab(url, 'Загрузка...');
            } else {
                const tab = tabs.find(t => t.id === activeTab);
                if (tab) { tab.url = url; tab.title = url; }
                welcome.style.display = 'none';
                webviewContainer.style.display = 'block';
                setTimeout(() => { try { webview.src = url; } catch (e) { console.warn(e); } }, 50);
                urlBar.value = url;
                renderTabs();
                saveTabs();
                setTimeout(updateNavButtons, 100);
            }
        }

        function navigate() {
            const url = urlBar.value.trim();
            if (!url) return;
            if ((url.includes('.') && !url.includes(' ')) || url.startsWith('http')) {
                navigateTo(url, false);
            } else {
                navigateTo(SEARCH_URL + encodeURIComponent(url), true);
            }
        }

        function goHome() {
            const tab = tabs.find(t => t.id === activeTab);
            if (tab) { tab.url = ''; tab.title = 'Новая вкладка'; }
            welcome.style.display = 'flex';
            webviewContainer.style.display = 'none';
            webview.src = '';
            urlBar.value = '';
            searchInput.value = '';
            renderTabs();
            saveTabs();
            updateNavButtons();
        }

        function goBack() { try { if (webview.canGoBack()) { webview.goBack(); setTimeout(updateNavButtons, 300); } } catch (e) { console.warn(e); } }
        function goForward() { try { if (webview.canGoForward()) { webview.goForward(); setTimeout(updateNavButtons, 300); } } catch (e) { console.warn(e); } }
        function refresh() { try { loadingIndicator.classList.add('active'); webview.reload(); } catch (e) { console.warn(e); loadingIndicator.classList.remove('active'); } }

        function updateNavButtons() {
            try {
                backBtn.disabled = !webview.canGoBack();
                forwardBtn.disabled = !webview.canGoForward();
            } catch (e) { backBtn.disabled = true; forwardBtn.disabled = true; }
        }

        function search(openInNewTab = true) {
            const query = searchInput.value.trim();
            if (!query) return;
            navigateTo(SEARCH_URL + encodeURIComponent(query), openInNewTab);
        }

        // --- Контекстное меню ---
        webview.addEventListener('context-menu', (e) => {
            e.preventDefault();
            const x = e.x, y = e.y;
            webview.executeJavaScript(
                '(function(){var el=document.elementFromPoint('+x+','+y+');if(el){var l=el.href||el.getAttribute("href")||"";if(!l&&el.closest){var p=el.closest("a");if(p)l=p.href||"";}return JSON.stringify(l);}return JSON.stringify("");})()'
            ).then(function(r){ window.electronAPI.showContextMenu(JSON.parse(r)); }).catch(function(){ window.electronAPI.showContextMenu(''); });
        });

        window.electronAPI.onOpenNewTab(function(link){ if (link) navigateTo(link, true); });
        window.electronAPI.onRefresh(function(){ refresh(); });

        // --- Скачивание: индикатор ---
        window.electronAPI.onDownloadProgress((data) => {
            const el = document.getElementById('downloadIndicator');
            if (el) {
                el.classList.add('show');
                document.getElementById('downloadFilename').textContent = data.filename;
                const percent = Math.round(data.progress * 100);
                document.getElementById('downloadPercent').textContent = percent + '%';
                document.getElementById('downloadProgressFill').style.width = percent + '%';
            }
        });
        window.electronAPI.onDownloadDone((data) => {
            setTimeout(() => {
                const el = document.getElementById('downloadIndicator');
                if (el) el.classList.remove('show');
            }, 2000);
        });

        // --- Пароли ---
        async function autoFillForms(url) {
            try {
                const domain = new URL(url).hostname;
                const passwords = await window.electronAPI.getPasswordsForDomain(domain);
                if (Object.keys(passwords).length === 0) return;
                const script = '(function(){var data=' + JSON.stringify(passwords) + ';var inputs=document.querySelectorAll("input[type=\\"password\\"]");if(inputs.length===0)return;var u=document.querySelector("input[type=\\"text\\"],input[name=\\"username\\"],input[name=\\"email\\"]");if(u){u.value=Object.keys(data)[0];u.dispatchEvent(new Event("input",{bubbles:true}));}var p=inputs[0];if(p){p.value=data[Object.keys(data)[0]];p.dispatchEvent(new Event("input",{bubbles:true}));}})();';
                webview.executeJavaScript(script);
            } catch (e) { console.warn('Автозаполнение ошибка:', e); }
        }

        function injectPasswordCapture() {
            const script = '(function(){document.querySelectorAll("form").forEach(function(f){f.addEventListener("submit",function(){var u=this.querySelector("input[type=\\"text\\"],input[name=\\"username\\"],input[name=\\"email\\"]");var p=this.querySelector("input[type=\\"password\\"]");if(u&&p&&u.value&&p.value){window.parent.postMessage({type:"save-password",domain:window.location.hostname,username:u.value,password:p.value},"*");}});});})();';
            webview.executeJavaScript(script);
        }

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'save-password') {
                window.electronAPI.savePassword(event.data.domain, event.data.username, event.data.password);
                console.log('Пароль сохранён для', event.data.domain);
            }
        });

        // === ПЕРЕХВАТ ФАЙЛОВ ДЛЯ MOODLE ===
        function isFileLink(url) {
            if (!url) return false;
            const extensions = ['.pdf','.doc','.docx','.xls','.xlsx','.ppt','.pptx','.zip','.rar','.7z','.tar','.gz','.jpg','.jpeg','.png','.gif','.bmp','.svg','.webp','.mp3','.mp4','.avi','.mkv','.mov','.txt','.csv','.json','.xml','.exe','.msi','.dmg','.deb','.rpm'];
            const lower = url.toLowerCase();
            return extensions.some(ext => lower.includes(ext) || lower.endsWith(ext));
        }

        webview.addEventListener('dom-ready', () => {
            const interceptor = `
                (function() {
                    function isFileLink(url) {
                        if (!url) return false;
                        const exts = ['.pdf','.doc','.docx','.xls','.xlsx','.ppt','.pptx','.zip','.rar','.7z','.tar','.gz','.jpg','.jpeg','.png','.gif','.bmp','.svg','.webp','.mp3','.mp4','.avi','.mkv','.mov','.txt','.csv','.json','.xml','.exe','.msi','.dmg'];
                        const lower = url.toLowerCase();
                        return exts.some(ext => lower.includes(ext) || lower.endsWith(ext));
                    }
                    document.addEventListener('click', function(e) {
                        let target = e.target;
                        while (target && target.tagName !== 'A') target = target.parentElement;
                        if (!target) return;
                        const href = target.getAttribute('href');
                        if (!href) return;
                        if (isFileLink(href)) {
                            const isNewWindow = target.getAttribute('target') === '_blank';
                            window.parent.postMessage({ type: 'file-link-clicked', url: href, openInNewTab: isNewWindow }, '*');
                            if (!isNewWindow) e.preventDefault();
                        }
                    }, true);
                })();
            `;
            webview.executeJavaScript(interceptor);
        });

        webview.addEventListener('new-window', (e) => {
            if (isFileLink(e.url)) {
                e.preventDefault();
                console.log('🔗 Файл через new-window:', e.url);
                navigateTo(e.url, true);
            }
        });

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data && data.type === 'file-link-clicked') {
                let url = data.url;
                if (url.startsWith('/')) {
                    try {
                        const base = new URL(webview.getURL());
                        url = base.origin + url;
                    } catch (e) {}
                }
                console.log('🔗 Перехвачен файл:', url);
                navigateTo(url, data.openInNewTab !== false);
            }
        });

        // --- События webview ---
        webview.addEventListener('did-start-loading', () => loadingIndicator.classList.add('active'));
        webview.addEventListener('did-stop-loading', () => { loadingIndicator.classList.remove('active'); updateNavButtons(); });
        webview.addEventListener('did-navigate', (e) => {
            const url = e.url;
            urlBar.value = url;
            const tab = tabs.find(t => t.id === activeTab);
            if (tab) { tab.url = url; tab.title = url; renderTabs(); saveTabs(); }
            updateNavButtons();
            setTimeout(() => { autoFillForms(url); setTimeout(injectPasswordCapture, 300); }, 500);
        });
        webview.addEventListener('page-title-updated', (e) => {
            const tab = tabs.find(t => t.id === activeTab);
            if (tab && e.title) { tab.title = e.title; renderTabs(); saveTabs(); }
        });
        webview.addEventListener('dom-ready', () => {
            updateNavButtons();
            const url = webview.getURL();
            if (url) { autoFillForms(url); setTimeout(injectPasswordCapture, 300); }
        });
        webview.addEventListener('did-fail-load', (e) => { loadingIndicator.classList.remove('active'); console.warn('Ошибка загрузки:', e); });

        window.addEventListener('beforeunload', () => saveTabs());

        loadTabs();
        setTimeout(updateScrollButtons, 100);
    </script>
</body>
</html>

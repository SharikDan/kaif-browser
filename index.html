<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>KaifBrowser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a0a0a 50%, #0f0f0f 100%);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 {
            font-size: 64px;
            color: #ff0040;
            text-shadow: 0 0 30px rgba(255,0,64,0.7);
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            border: 2px solid #ff0040;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>KaifBrowser Works!</h1>
        <p>Electron is running</p>
    </div>
</body>
</html>
